[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:falkordb]
command=/usr/local/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/falkordb.log
stderr_logfile=/var/log/supervisor/falkordb-error.log
startsecs=5
startretries=3

[program:vessels]
command=/app/scripts/start-vessels.sh
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/vessels.log
stderr_logfile=/var/log/supervisor/vessels-error.log
startsecs=10
startretries=5
# Wait for FalkorDB to be ready before starting
depends_on=falkordb

[eventlistener:startup]
command=/app/scripts/startup-check.sh
events=SUPERVISOR_STATE_CHANGE_RUNNING
autostart=true
autorestart=unexpected
