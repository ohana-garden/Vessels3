# FalkorDB (Redis) Configuration for Vessels

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Modules - Load FalkorDB graph module
loadmodule /usr/lib/redis/modules/falkordb.so

# Persistence
dir /data/falkordb
dbfilename dump.rdb

# Save to disk
# Save after 900 seconds if at least 1 key changed
save 900 1
# Save after 300 seconds if at least 10 keys changed
save 300 10
# Save after 60 seconds if at least 10000 keys changed
save 60 10000

# AOF persistence for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 1gb
maxmemory-policy noeviction

# Logging
loglevel notice
logfile ""

# Timeouts
timeout 0
tcp-keepalive 300

# Max clients
maxclients 10000

# Lua time limit
lua-time-limit 5000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notification
notify-keyspace-events ""

# Hash settings
hash-max-listpack-entries 512
hash-max-listpack-value 64

# List settings
list-max-listpack-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64

# Sorted set settings
zset-max-listpack-entries 128
zset-max-listpack-value 64

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hz
hz 10
dynamic-hz yes

# AOF rewrite
aof-rewrite-incremental-fsync yes

# RDB save
rdb-save-incremental-fsync yes
