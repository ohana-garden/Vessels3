# Vessels Docker Compose
# Complete runtime environment with FalkorDB

version: '3.8'

services:
  vessels:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vessels
    ports:
      - "6379:6379"   # FalkorDB
      - "8000:8000"   # Vessels API
    environment:
      # API Keys - pass from host environment or .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # FalkorDB Configuration
      - FALKORDB_HOST=localhost
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_DATA_DIR=/data/falkordb
      # Vessels Configuration
      - VESSELS_DEBUG=${VESSELS_DEBUG:-false}
      - VESSELS_LOG_LEVEL=${VESSELS_LOG_LEVEL:-INFO}
      - VESSELS_GRAPH_NAME=${VESSELS_GRAPH_NAME:-vessels}
    volumes:
      # Persist FalkorDB data
      - vessels-data:/data/falkordb
      # Mount logs for debugging
      - vessels-logs:/var/log/supervisor
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - vessels-network

  # Alternative: Vessels with external FalkorDB
  vessels-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vessels-api
    command: vessels-only
    profiles:
      - external-db
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - VESSELS_DEBUG=${VESSELS_DEBUG:-false}
      - VESSELS_LOG_LEVEL=${VESSELS_LOG_LEVEL:-INFO}
      - VESSELS_GRAPH_NAME=${VESSELS_GRAPH_NAME:-vessels}
    depends_on:
      falkordb-standalone:
        condition: service_healthy
    networks:
      - vessels-network

  # Standalone FalkorDB for external-db profile
  falkordb-standalone:
    image: falkordb/falkordb:latest
    container_name: falkordb
    profiles:
      - external-db
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vessels-network

volumes:
  vessels-data:
    driver: local
  vessels-logs:
    driver: local
  falkordb-data:
    driver: local

networks:
  vessels-network:
    driver: bridge
