# Vessels All-in-One Docker Compose
#
# Quick Start:
#   1. Copy .env.example to .env and add your API keys
#   2. Run: docker compose up -d
#   3. Open: http://localhost:8080
#
# The container includes:
#   - Vessels Agent Framework (Web UI, MCP support, Personas)
#   - FalkorDB (Graph database for knowledge storage)
#   - TigerBeetle (Financial transaction engine)

services:
  vessels:
    build:
      context: .
      dockerfile: Dockerfile
    image: vessels:latest
    container_name: vessels
    ports:
      - "8080:80"  # Web UI
    volumes:
      # Persistent data storage
      - vessels-data:/data/falkordb
      - vessels-tb:/data/tigerbeetle
      - vessels-work:/vessels/work_dir
    environment:
      # LLM API Keys (at least one required)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Graphiti Knowledge Graph Configuration
      - GRAPHITI_LLM_PROVIDER=${GRAPHITI_LLM_PROVIDER:-openai}
      - GRAPHITI_LLM_MODEL=${GRAPHITI_LLM_MODEL:-gpt-4o-mini}
      - GRAPHITI_EMBEDDING_MODEL=${GRAPHITI_EMBEDDING_MODEL:-text-embedding-3-small}
      # Hume AI Voice Integration (optional)
      - HUME_API_KEY=${HUME_API_KEY:-}
      - HUME_SECRET_KEY=${HUME_SECRET_KEY:-}
      # Authentication (optional)
      - AUTH_LOGIN=${AUTH_LOGIN:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # Internal service configuration (defaults are fine)
      - FALKORDB_HOST=localhost
      - FALKORDB_PORT=6379
      - FALKORDB_DATABASE=vessels
      - TIGERBEETLE_HOST=localhost
      - TIGERBEETLE_PORT=3000
      - WEB_UI_HOST=0.0.0.0
      - WEB_UI_PORT=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  vessels-data:
    name: vessels-falkordb-data
  vessels-tb:
    name: vessels-tigerbeetle-data
  vessels-work:
    name: vessels-work-dir
